# CalibrationConfig defaults for calibrate_wealth_distortion.py. CLI dotlist
# overrides win over this file (e.g. `python calibrate_wealth_distortion.py
# n_agents=500 device=cpu`); a different file entirely via `config=<path>`.

base_exp: ks_n200
n_agents: 1000
num_envs: 8         # see sibling experiment's README "Batch width" -- same reasoning
bo_calls: 50
bo_init_points: 8   # 3-D search (scale, a, b): bigger initial design than 1-D
scale_bounds: [0.3, 3.0]   # mean(kappa) -- log-uniform
a_bounds: [0.1, 10.0]      # Beta distortion shape param -- log-uniform
b_bounds: [0.1, 10.0]      # Beta distortion shape param -- log-uniform
targets:
  top_0.1_share: 0.70   # already cited in the paper's own text (Xavier/US data)
  # capital_gini: 0.85  # NOT independently sourced -- add your own citation
                         # before uncommenting and trusting this number
sim_steps: 5000
seed: 0
device: gpu
total_timesteps: null
out_dir: results
save_raw: best      # "none" | "best" | "all" -- see sibling README "Raw data"
