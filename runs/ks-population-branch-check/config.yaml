# CheckConfig defaults for run_branch_check.py. CLI dotlist overrides win
# over this file (e.g. `python run_branch_check.py device=cpu seeds=[0,1]`),
# or point at a different file entirely via `config=<path>`.

base_exp: ks_n200   # configs/exp/ks_n200.yaml -- total_timesteps and every
                    # other hyperparameter come from here, unchanged, for
                    # both population/batch-width arms (see run_branch_check.py)

seeds: [0, 1, 2, 3, 4, 5]

n_snapshots: 12   # full Gini-over-training trajectory per run, matching
                  # ks_n200_top's own diagnostics
sim_steps: 5000
device: gpu
