# CalibrationConfig defaults for calibrate_kappa_scale.py. CLI dotlist
# overrides win over this file (e.g. `python calibrate_kappa_scale.py
# n_agents=500 device=cpu`); a different file entirely via `config=<path>`.

base_exp: ks_n200   # only env.n_agents/num_envs are overridden below -- see
                    # ks_n2000.yaml, same protocol, already validated to n=2000
n_agents: 1000
num_envs: 8         # ks_n200's own is 32; null -> leave it at 32. 8 puts the
                    # batch width (num_envs * n_agents = 8,000) inside the
                    # 4,000-20,000 plateau the paper's scaling mesh measured,
                    # rather than 32 * 1000 = 32,000, past the knee
mode: es            # "es" (adaptive search, default) | "grid" (flat sweep)
k_grid: [0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5]   # used only when mode: grid
es_iters: 12
es_step0: 0.3
es_grow: 1.5
es_shrink: 0.7
es_k0: null         # null -> 1/mean(base_vector) naive guess
sim_steps: 5000
seed: 0
device: gpu
total_timesteps: null   # null -> ks_n200's own budget (128000 steps)
out_dir: results
