# KS population-scaling cell: n = 20.
#
# Spec copied from the reference run `runs/ks/top` (its resolved config.yaml):
# identical across the three cells (ks_n20 / ks_n200 / ks_n2000) in every
# hyperparameter — optimizer trajectory (640 updates x 4 epochs x 64
# minibatches, annealed LR, seed 0 -> bit-identical theta_0), per-update data
# (E=32 envs x T=200 steps), env parameters (beta=0.95, max_steps=5000) — so
# ONLY the population n differs. The diagnostic simulation runs at the SAME
# population the policy was trained on (diag.n_agents = env.n_agents).
extends: ks

env:
  n_agents: 20

train:
  num_envs: 32
  rollout_len: 200
  total_timesteps: 128000   # sequential steps = 640 updates x 200
  update_epochs: 4
  num_minibatches: 64
  log_every: 100

diag:
  n_snapshots: 12
  sim_steps: 5000
  n_agents: 20              # eval population = training population

log:
  run_name: ks_n20
  save_agents: 200

run:
  seed: 0
  device: gpu
  prealloc: true
