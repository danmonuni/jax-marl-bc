# Krusell-Smith (exogenous labour via a 4-state employment Markov chain).
exp: ks

env:
  kind: ks
  n_agents: 20
  delta: 0.025
  max_steps: 5000
  k_init: 1.0
  # Every agent starts at k_init. Pinned explicitly: this is what all runs
  # through 2026-07 (including the numbers in the paper draft) did, back when
  # constant initialization was the only option. Drop this line to inherit the
  # default: U(3, 20) per agent, redrawn at every episode reset.
  k_init_dist: constant
  # `labour` = own employment status x productivity: without it the policy
  # cannot condition consumption on being unemployed (no precautionary motive).
  obs_vars: [capital, labour, mean_capital, aggregate_state, kappa, lambda]

train:
  total_timesteps: 500000   # sequential steps (x num_envs=20 -> 10M transitions)
  num_minibatches: 20
  ent_coef: 0.0
  anneal_lr: true   # keeps approx_kl in check once the policy goes near-deterministic
                    # (ks-local-01 hit KL~0.05 late in training at fixed lr)

diag:
  n_snapshots: 200   # resolution of the training-evolution figures (heatmap etc.)
  sim_steps: 5000   # one long reset-free evaluation episode (KS-style long sim)
