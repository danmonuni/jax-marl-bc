# Krusell-Smith (exogenous labour via a 4-state employment Markov chain).
exp: ks

env:
  kind: ks
  n_agents: 20
  delta: 0.025
  max_steps: 500
  k_init: 1.0
  # `labour` = own employment status x productivity: without it the policy
  # cannot condition consumption on being unemployed (no precautionary motive).
  obs_vars: [capital, labour, mean_capital, aggregate_state, kappa, lambda]

train:
  total_timesteps: 500000   # sequential steps (x num_envs=20 -> 10M transitions)
  num_minibatches: 20
  ent_coef: 0.0

diag:
  n_snapshots: 12   # resolution of the training-evolution figures (heatmap etc.)
  sim_steps: 5000   # one long reset-free evaluation episode (KS-style long sim)
