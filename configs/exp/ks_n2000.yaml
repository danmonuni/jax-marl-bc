# KS population-scaling cell: n = 2000.
# Spec copied from the reference run `runs/ks/top` — see ks_n20.yaml for the
# protocol. Only the population differs across cells; the diagnostic
# simulation runs at the training population (diag.n_agents = env.n_agents).
extends: ks

env:
  n_agents: 2000
  k_init_dist: constant     # as-run: every agent starts at k_init (inherited from ks)

train:
  num_envs: 32
  rollout_len: 200
  total_timesteps: 128000   # sequential steps = 640 updates x 200
  update_epochs: 4
  num_minibatches: 64
  log_every: 100

diag:
  n_snapshots: 12
  sim_steps: 5000
  n_agents: 2000            # eval population = training population

log:
  run_name: ks_n2000
  save_agents: 200          # cap raw per-agent dump; aggregates always full

run:
  seed: 0
  device: gpu
  prealloc: true
