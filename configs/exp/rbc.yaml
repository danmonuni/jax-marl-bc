# Real Business Cycle (single-agent, endogenous labour). The driver runs two
# variants: "textbook" (delta=1.0, closed-form solution) and "typical"
# (delta=0.025). delta below is the typical default; the driver overrides it.
exp: rbc

env:
  kind: rbc
  n_agents: 1
  delta: 0.025
  b: 5.0
  rho: 0.9
  sigma: 0.01
  max_steps: 1000
  k_init: 1.0
  k_init_dist: constant     # pre-2026-08 behavior: every agent starts at k_init
  obs_vars: [capital]

train:
  total_timesteps: 50000    # sequential steps (x num_envs=20 -> 1M transitions)
  num_minibatches: 10
  ent_coef: 0.01
