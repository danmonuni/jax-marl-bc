# Head-to-head vs the original MARL-BC paper (Gabriele et al. 2026, Fig. 8):
# mean-field Krusell-Smith limit on a SINGLE parallel environment, matched
# budget of 1e5 per-agent transitions (num_envs=1 -> total_timesteps = 1e5
# sequential steps = 1e5 transitions per agent, n * 1e5 in total — exactly the
# paper's "1e5 per-agent updates"). The paper's single-CPU wall-clock times
# (digitized from Fig. 8, right panel) overlay automatically via
# reference_csv; the speedup figure divides each reference series by our time
# at the same n. Run on the Colab T4:
#   python -m jmbc.sweep sweep=scaling_paper_ks
name: scaling-paper-ks
base_exp: ks

axes:
  env.n_agents: [10, 20, 50, 100, 200, 500]

overrides:
  train.num_envs: 1
  train.total_timesteps: 100000
  train.num_minibatches: 8       # 64 does not divide the 1-env batch (200*n)
  diag.economic: false
  diag.distributional: false
  run.device: auto

repeats: 1
collect_diagnostics: false
figures: [walltime, throughput, speedup]
reference_csv: configs/reference/marlbc_ks_fig8_cpu.csv
