# Tiny CPU smoke for the new figure kinds: 2x2 KS mesh exercising the phase
# diagram, the constant-product tradeoff, the reference overlay and speedup.
name: scaling-phase-smoke
base_exp: ks

axes:
  env.n_agents: [10, 20]
  train.num_envs: [1, 2]

overrides:
  train.total_timesteps: 400
  train.rollout_len: 20
  train.num_minibatches: 4
  env.max_steps: 50
  diag.economic: false
  diag.distributional: false
  run.device: cpu

repeats: 1
collect_diagnostics: false
figures: [phase, tradeoff, walltime, throughput, speedup]
tradeoff_product: 20
reference_csv: configs/reference/marlbc_ks_fig8_cpu.csv
