# Agents/environments speed tradeoff: full n_agents x num_envs mesh of the
# Krusell-Smith economy at a fixed sequential budget -> phase diagram of
# absolute run times. The grid is chosen so every constant-product pair with
# n_agents * num_envs = 200 lies on it; the "tradeoff" figure slices that
# anti-diagonal (each tick a different split of the same batch width).
#   python -m jmbc.sweep sweep=scaling_phase
name: scaling-phase
base_exp: ks

axes:
  env.n_agents:   [1, 2, 5, 10, 20, 40, 100, 200]
  train.num_envs: [1, 2, 5, 10, 20, 40, 100, 200]

overrides:
  train.total_timesteps: 20000   # sequential: 100 updates per cell
  train.num_minibatches: 8       # divides every batch on the mesh (200*E*n)
  diag.economic: false
  diag.distributional: false
  run.device: auto

repeats: 1
collect_diagnostics: false
figures: [phase, tradeoff]
tradeoff_product: 200
