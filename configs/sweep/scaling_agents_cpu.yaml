# Same tensor program, same sequential budget as scaling_agents.yaml, but
# forced onto the CPU backend (run.device: cpu) instead of GPU. This isolates
# the *hardware* axis from the *architecture* axis: scaling_paper_ks already
# shows compiled-vs-interpreted-loop (jmbc-GPU vs the original MARL-BC's
# Python loop on CPU); this shows the SAME compiled jmbc program on GPU vs
# CPU, holding the code identical.
#
# n_agents axis is trimmed relative to scaling_agents.yaml (drops the
# 2000-20000 tail) because a CPU XLA backend is still far slower per
# elementwise op at large batch width than a GPU -- the tail cells would
# take a very long time for limited payoff (the flat-vs-linear knee is
# already visible well before n_agents=1000). Extend the axis back out if
# you have the CPU time to spare.
#
# The row's "method" column is auto-tagged "jaxmarl-bc-cpu" (not
# "jaxmarl-bc") because run.device=cpu -- see jmbc/sweep.py. That means its
# own results.csv is already reference_csv-shaped: point the GPU sweep's
# replot at it to get a same-framework GPU-vs-CPU comparison figure:
#   python -m jmbc.sweep sweep=scaling_agents                        # GPU run (Colab)
#   python -m jmbc.sweep sweep=scaling_agents_cpu                    # this CPU run
#   python -m jmbc.sweep sweep=scaling_agents \
#       replot=benchmarks/scaling-agents-5env \
#       reference_csv=benchmarks/scaling-agents-5env-cpu/results.csv \
#       figures="[walltime,throughput,speedup]"
name: scaling-agents-5env-cpu
base_exp: ks

axes:
  env.n_agents: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]

overrides:
  train.num_envs: 5
  train.total_timesteps: 20000   # sequential: 100 updates per cell (matches scaling_agents.yaml)
  train.num_minibatches: 8       # divides every 5-env batch (1000*n)
  diag.economic: false
  diag.distributional: false
  run.device: cpu

repeats: 1
collect_diagnostics: false
figures: [walltime, throughput]
