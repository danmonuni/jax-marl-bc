# Tiny smoke variant of the scaling sweep for quick end-to-end checks.
name: scaling_smoke
base_exp: rbc

axes:
  env.n_agents: [1, 4]
  train.num_envs: [4, 8]

overrides:
  train.total_timesteps: 4000
  train.rollout_len: 20
  env.max_steps: 50
  diag.economic: false
  diag.distributional: false
  run.device: cpu

repeats: 1
collect_diagnostics: false
