# ==========================================================================
# Population scaling on GPU, 3 seeds per cell.
#
#   python -m jmbc.sweep sweep=scan_agents_multiseed_gpu
#
# Protocol: one environment, a fixed 100,000-sequential-step budget per cell
# (500 PPO updates of rollout_len 200), n_agents swept on a 1-2-5 progression
# from 1 to 200,000. Each cell is re-run under seeds 0, 1, 2 so every timing
# gets a mean and a sample standard deviation.
#
# The ECONOMY follows runs/paper-ks-fig34/config.yaml -- 200-step episodes and
# U(10, 70) starting capital redrawn per episode -- NOT the 5,000-step / k_0 = 1
# setup that runs/scan_dingle_agent_CPU inherited from configs/exp/ks.yaml.
# The PPO budget and the timing harness are otherwise that scan's.
#
# This file is SELF-CONTAINED by construction: `overrides` pins every field of
# the experiment schema that this sweep depends on, so the cells do not silently
# inherit anything from configs/base.yaml or configs/exp/ks.yaml. Only
# `env.n_agents` (the axis) and `run.seed` (the repeat) vary across cells.
# The resolved per-cell config the runner actually built is echoed in the
# `launch` banner printed before each cell.
#
# Cost: single-seed this sweep took ~2h05 on a Colab T4 (the 100k and 200k
# cells alone are ~30 and ~61 minutes). Three seeds is therefore ~6.2 hours —
# run it in one Colab session with a T4 or better.
#
# Memory: the 200,000-agent cell forecasts ~10.3 GB of the T4's 11.7 GB
# preallocated pool (~88%) and is the largest cell that fits; the next rung
# (500,000) OOMs. `run.prealloc: true` gives the run one contiguous pool,
# which is what makes the 88% cell survive — do not share the GPU with
# another process while this runs.
#
# Pairs with scan_agents_multiseed_cpu.yaml (same program, CPU backend). To
# draw both on one axis plus the speedup curve, once BOTH have finished:
#   python -m jmbc.sweep sweep=scan_agents_multiseed_gpu \
#       replot=runs/scan_agents_multiseed_GPU \
#       reference_csv=runs/scan_agents_multiseed_CPU/results.csv \
#       figures="[walltime,throughput,speedup]"
# ==========================================================================
name: scan_agents_multiseed_GPU
out_dir: runs                 # -> runs/scan_agents_multiseed_GPU/
base_exp: ks

# ── what varies ───────────────────────────────────────────────────────────
axes:
  env.n_agents: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000,
                 10000, 20000, 50000, 100000, 200000]

# Repeats are seeds, not anonymous reruns: they land in results.csv as a
# `seed` column and are collapsed to mean/std/sem in results_summary.csv.
seeds: [0, 1, 2]

# ── what is held fixed (complete, explicit) ───────────────────────────────
overrides:
  # -- economy: Krusell-Smith, homogeneous agents, every agent at k_0 = 1 ---
  env.kind: ks
  env.alpha: 0.36
  env.beta: 0.95
  env.delta: 0.025
  env.max_steps: 200                # episode length = rollout_len: one reset
                                    # per rollout, as runs/paper-ks-fig34
  # Starting capital: the reference KS draw, U(10, 70) per agent, redrawn at
  # every episode reset. Pinned to runs/paper-ks-fig34/config.yaml -- NOT the
  # k_0 = 1 constant that configs/exp/ks.yaml still carries for the pre-2026-07
  # runs, and NOT the beta-rescaled U(3, 20) the schema defaults to.
  env.k_init_dist: uniform
  env.k_init_low: 10.0
  env.k_init_high: 70.0
  env.k_init_resample: per_episode  # new population at every reset
  env.obs_vars: [capital, labour, mean_capital, aggregate_state, kappa, lambda]
  env.kappas: null                  # null -> ones(n_agents): homogeneous
  env.lambdas: null                 # null -> ones(n_agents): homogeneous

  # -- PPO: fixed sequential budget per cell, independent of n_agents -------
  train.num_envs: 1                 # single environment: n_agents is the only width
  train.rollout_len: 200
  train.total_timesteps: 100000     # 100,000 / 200 = 500 updates per cell
  train.update_epochs: 4
  train.num_minibatches: 64
  train.lr: 3.0e-4
  train.anneal_lr: true
  train.gamma: 0.95
  train.gae_lambda: 0.95
  train.clip_eps: 0.2
  train.vf_coef: 0.5
  train.ent_coef: 0.0
  train.max_grad_norm: 0.5
  train.log_every: 100              # heartbeat only; no effect on the XLA graph

  # -- network: same 4,739-parameter actor-critic at every n_agents ---------
  net.hidden_dims: [64, 64]
  net.activation: tanh

  # -- diagnostics: OFF. This is a timing scan; Euler/Gini probes would add
  #    untimed post-training work and dominate the small cells. ------------
  diag.economic: false
  diag.distributional: false
  diag.n_snapshots: 200             # inert: collect_diagnostics is false
  diag.sim_steps: 200               # inert: collect_diagnostics is false
  diag.burn_frac: 0.5               # inert: collect_diagnostics is false
  diag.n_agents: null

  # -- execution -----------------------------------------------------------
  run.device: gpu                   # hard-pinned: fails loudly, never silently on CPU
  run.prealloc: true                # one contiguous 75% pool (needed by the 200k cell)
  run.seed: 0                       # superseded per-cell by `seeds` above

# ── output ────────────────────────────────────────────────────────────────
# results.csv is flushed after EVERY cell, so an interrupted scan keeps what it
# timed. Re-running with resume=true skips the (cell, seed) pairs already in it:
#   python -m jmbc.sweep sweep=scan_agents_multiseed_gpu resume=true
resume: false                       # set true to continue an interrupted scan
collect_diagnostics: false          # no per-cell diagnostics in results.csv
save_cell_runs: false               # timings only, no per-cell run directories
paired: false                       # single axis; irrelevant here
benchmark: false                    # AOT phase timer already isolates run time
# walltime: seconds per cell. transitions: agent-transitions/s, the throughput
# that actually scales with n_agents (plain `throughput` is sequential env
# steps/s, fixed by design here and merely walltime inverted).
figures: [walltime, transitions, throughput]   # all get +-1 s.d. whiskers
reference_csv: null
tradeoff_product: null
